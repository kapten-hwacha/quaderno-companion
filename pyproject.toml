[project]
name = "quaderno-companion"
version = "0.1.0"
description = "Autonomous background agent and E-ink bridge for Fujitsu Quaderno Gen 2"
readme = "README.md"
authors = [
    { name = "Karl-Andres Parts", email = "karl-andres.parts@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "pymupdf>=1.23.0",
    "dpt-rp1-py>=0.1.15",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "reportlab>=4.1.0",
    "pillow>=10.0.0",
    "setuptools<70",
    "python-multipart>=0.0.9",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "lz4>=4.3.0",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    "notebooklm-py[browser]>=0.8.1",
]

[project.scripts]
quadctl = "quaderno_companion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.5.0",
]

