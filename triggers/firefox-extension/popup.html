<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f1117;
      color: #f8fafc;
    }
    h3 { margin: 0 0 12px 0; font-size: 15px; font-weight: 600; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #272c3d;
      color: #fff;
      border: 1px solid #373e54;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:hover { background: #373e54; }
    .status {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>Quaderno Companion</h3>
  <button id="btn-push" class="btn">🚀 Send Current Tab</button>
  <button id="btn-sum" class="btn">📝 Summarize & Send</button>
  <div id="status" class="status">Connecting to localhost:5000...</div>
  <script src="popup.js"></script>
</body>
</html>
